<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Light.otf') format('opentype');font-weight:300;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;font-style:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#F8F9F8;padding:20px;display:flex;gap:12px;flex-wrap:wrap;}
.swatch{border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.04);min-width:130px;flex:1;}
.color{height:72px;}
.info{background:#fff;padding:10px 12px;}
.name{font-size:11px;font-weight:700;color:#0F1410;letter-spacing:-.01em;}
.hex{font-size:10px;font-family:monospace;color:#6B7B6D;margin-top:2px;}
.role{font-size:9px;color:#9DAD9F;margin-top:2px;text-transform:uppercase;letter-spacing:.06em;}
.pill{display:inline-block;margin-top:5px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px;background:rgba(22,163,74,.09);color:#16A34A;}
</style></head><body>
<div class="swatch"><div class="color" style="background:#BDF300;"></div><div class="info"><div class="name">Volt</div><div class="hex">#BDF300</div><div class="role">Primary accent — 10% max</div></div></div>
<div class="swatch"><div class="color" style="background:#3D5200;"></div><div class="info"><div class="name">Volt Text</div><div class="hex">#3D5200</div><div class="role">Volt text on white</div><span class="pill">AA 6.1:1</span></div></div>
<div class="swatch"><div class="color" style="background:#1A2400;"></div><div class="info"><div class="name">Volt On</div><div class="hex">#1A2400</div><div class="role">Text on volt bg</div></div></div>
<div class="swatch"><div class="color" style="background:#062517;"></div><div class="info"><div class="name">Deep Green</div><div class="hex">#062517</div><div class="role">Brand dark bg</div></div></div>
<div class="swatch"><div class="color" style="background:#0B1118;"></div><div class="info"><div class="name">Navy Dark</div><div class="hex">#0B1118</div><div class="role">Alt dark bg</div></div></div>
<div class="swatch"><div class="color" style="background:#F1F2EF;"></div><div class="info"><div class="name">Off-White</div><div class="hex">#F1F2EF</div><div class="role">Logo bg / text inv</div></div></div>
</body></html>
