<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Light.otf') format('opentype');font-weight:300;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;font-style:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#F3F4F2;padding:20px;display:flex;gap:14px;flex-wrap:wrap;}
.label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#9DAD9F;margin-bottom:8px;}

/* Bottom nav */
.bottom-nav{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:24px;padding:10px 8px 12px;display:flex;justify-content:space-around;box-shadow:0 1px 4px rgba(0,0,0,.07);flex:1;min-width:260px;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 14px;border-radius:14px;cursor:pointer;}
.nav-item svg{width:22px;height:22px;}
.nav-item span{font-size:10px;font-weight:500;color:#6B7B6D;}
.nav-item.on span{color:#3D5200;font-weight:700;}

/* Segmented control */
.seg-wrap{flex:1;min-width:200px;display:flex;flex-direction:column;}
.seg-ctrl{display:flex;padding:3px;background:#ECEEED;border-radius:9999px;gap:2px;}
.seg-btn{flex:1;height:36px;border-radius:9999px;font-family:'Satoshi',sans-serif;font-size:12px;font-weight:600;color:#6B7B6D;border:none;background:transparent;cursor:pointer;}
.seg-btn.active{background:#fff;color:#0F1410;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.05);}
</style></head><body>
<div style="flex:1;min-width:260px;">
  <div class="label">Bottom Navigation</div>
  <div class="bottom-nav">
    <div class="nav-item on">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3D5200" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6B7B6D" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>
      <span>Cobrar</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6B7B6D" stroke-width="2" stroke-linecap="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      <span>Historial</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6B7B6D" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span>Perfil</span>
    </div>
  </div>
</div>
<div class="seg-wrap">
  <div class="label">Segmented Control</div>
  <div class="seg-ctrl">
    <button class="seg-btn active">Semana</button>
    <button class="seg-btn">Mes</button>
    <button class="seg-btn">Año</button>
  </div>
  <div style="margin-top:12px;">
  <div class="seg-ctrl" style="border-radius:14px;">
    <button class="seg-btn">Detalle</button>
    <button class="seg-btn active">Resumen</button>
  </div>
  </div>
</div>
</body></html>
