<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Light.otf') format('opentype');font-weight:300;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;font-style:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#F3F4F2;padding:24px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;}
.card{background:#fff;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:100px;}
.token{font-size:10px;font-weight:700;color:#3D5200;font-family:monospace;}
.val{font-size:9px;color:#9DAD9F;line-height:1.5;}
</style></head><body>
<div class="card" style="box-shadow:0 1px 2px rgba(0,0,0,.05);"><div class="token">--shadow-xs</div><div class="val">1px · 0.05</div></div>
<div class="card" style="box-shadow:0 1px 4px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.04);"><div class="token">--shadow-sm</div><div class="val">cards, dropdowns</div></div>
<div class="card" style="box-shadow:0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.05);"><div class="token">--shadow-md</div><div class="val">modals, overlays</div></div>
<div class="card" style="box-shadow:0 8px 32px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);"><div class="token">--shadow-lg</div><div class="val">hero cards</div></div>
<div class="card" style="box-shadow:0 20px 48px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.07);"><div class="token">--shadow-xl</div><div class="val">phone frames</div></div>
</body></html>
