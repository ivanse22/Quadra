<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Light.otf') format('opentype');font-weight:300;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;font-style:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#eee;padding:20px;display:flex;gap:0;}
.col{flex:1;display:flex;flex-direction:column;}
.col-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#6B7B6D;text-align:center;padding:8px 0;background:#e4e6e3;}
.block{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(0,0,0,.06);}
.token{font-size:10px;font-weight:700;color:#3D4A3F;}
.hex{font-size:9px;font-family:monospace;color:#6B7B6D;}
</style></head><body>
<div class="col">
  <div class="col-label">Light Mode</div>
  <div class="block" style="background:#ffffff"><span class="token">--bg</span><span class="hex">#FFFFFF</span></div>
  <div class="block" style="background:#F8F9F8"><span class="token">--bg-subtle</span><span class="hex">#F8F9F8</span></div>
  <div class="block" style="background:#F3F4F2"><span class="token">--surf-1</span><span class="hex">#F3F4F2</span></div>
  <div class="block" style="background:#ECEEED"><span class="token">--surf-2</span><span class="hex">#ECEEED</span></div>
  <div class="block" style="background:#E4E6E3"><span class="token">--surf-3</span><span class="hex">#E4E6E3</span></div>
  <div class="block" style="background:#111410"><span class="token" style="color:#F1F2EF">--surf-inv</span><span class="hex" style="color:#617063">#111410</span></div>
</div>
<div class="col">
  <div class="col-label" style="background:#111810;color:#617063;">Dark Mode</div>
  <div class="block" style="background:#090D0B;border-color:rgba(189,243,0,.08)"><span class="token" style="color:#A0B3A2">--bg</span><span class="hex" style="color:#617063">#090D0B</span></div>
  <div class="block" style="background:#0D1410;border-color:rgba(189,243,0,.08)"><span class="token" style="color:#A0B3A2">--bg-subtle</span><span class="hex" style="color:#617063">#0D1410</span></div>
  <div class="block" style="background:#111810;border-color:rgba(189,243,0,.08)"><span class="token" style="color:#A0B3A2">--surf-1</span><span class="hex" style="color:#617063">#111810</span></div>
  <div class="block" style="background:#172014;border-color:rgba(189,243,0,.08)"><span class="token" style="color:#A0B3A2">--surf-2</span><span class="hex" style="color:#617063">#172014</span></div>
  <div class="block" style="background:#1E2B1A;border-color:rgba(189,243,0,.08)"><span class="token" style="color:#A0B3A2">--surf-3</span><span class="hex" style="color:#617063">#1E2B1A</span></div>
  <div class="block" style="background:#F1F2EF;border-color:rgba(0,0,0,.1)"><span class="token">--surf-inv</span><span class="hex">#F1F2EF</span></div>
</div>
</body></html>
