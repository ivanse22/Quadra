<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:rgba(15,20,16,.55);padding:20px;display:flex;align-items:center;justify-content:center;min-height:100vh;backdrop-filter:blur(2px);}
.dialog{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:24px;overflow:hidden;box-shadow:0 20px 48px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.07);width:100%;max-width:320px;}
.dialog-body{padding:24px;}
.dialog-icon{width:48px;height:48px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.dialog-title{font-size:18px;font-weight:900;letter-spacing:-.03em;color:#0F1410;margin-bottom:8px;line-height:1.15;}
.dialog-desc{font-size:12px;color:#6B7B6D;line-height:1.65;margin-bottom:0;}
.dialog-actions{display:flex;flex-direction:column;gap:8px;padding:0 24px 20px;}
.dbtn{height:52px;width:100%;border-radius:9999px;font-family:'Satoshi',sans-serif;font-size:13px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.dbtn-primary{background:#BDF300;color:#1A2400;}
.dbtn-secondary{background:#ECEEED;color:#3D4A3F;border:1.5px solid rgba(0,0,0,.12);}
</style></head><body>
<div class="dialog">
  <div class="dialog-body">
    <div class="dialog-icon" style="background:rgba(189,243,0,.08);border:1px solid rgba(189,243,0,.20);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D5200" stroke-width="2" stroke-linecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    </div>
    <div class="dialog-title">Confirmar cobro</div>
    <div class="dialog-desc">Estás a punto de enviar un cobro de <strong style="color:#3D5200;">$4,200.00 MXN</strong> a Martínez Corp. Esta acción no se puede deshacer.</div>
  </div>
  <div class="dialog-actions">
    <button class="dbtn dbtn-primary">Enviar cobro</button>
    <button class="dbtn dbtn-secondary">Cancelar</button>
  </div>
</div>
</body></html>
