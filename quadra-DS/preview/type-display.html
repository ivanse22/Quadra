<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Light.otf') format('opentype');font-weight:300;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;font-style:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#fff;padding:24px 28px;}
.row{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.06);}
.row:last-child{border-bottom:none;}
.meta{}
.token{font-size:10px;font-weight:700;color:#3D5200;font-family:monospace;}
.spec{font-size:10px;color:#6B7B6D;margin-top:2px;}
</style></head><body>
<div class="row"><div class="meta"><div class="token">--t-hero</div><div class="spec">56–80px · 900</div></div><div style="font-size:clamp(3.5rem,2.8rem+3.5vw,5rem);font-weight:900;letter-spacing:-.05em;line-height:1;color:#0F1410;">$8,400</div></div>
<div class="row"><div class="meta"><div class="token">--t-3xl</div><div class="spec">36–48px · 900</div></div><div style="font-size:clamp(2.25rem,1.8rem+2.25vw,3rem);font-weight:900;letter-spacing:-.05em;line-height:1;color:#0F1410;">Disponible</div></div>
<div class="row"><div class="meta"><div class="token">--t-2xl</div><div class="spec">28–36px · 900</div></div><div style="font-size:clamp(1.75rem,1.4rem+1.75vw,2.25rem);font-weight:900;letter-spacing:-.05em;color:#0F1410;">Nuevo Cobro</div></div>
<div class="row"><div class="meta"><div class="token">--t-xl</div><div class="spec">22–28px · 900</div></div><div style="font-size:clamp(1.375rem,1.2rem+.88vw,1.75rem);font-weight:900;letter-spacing:-.05em;color:#0F1410;">Historial</div></div>
<div class="row"><div class="meta"><div class="token">--t-lg</div><div class="spec">17–19px · 700</div></div><div style="font-size:clamp(1.0625rem,1rem+.31vw,1.1875rem);font-weight:700;letter-spacing:-.02em;color:#0F1410;">Resumen del cobro</div></div>
<div class="row"><div class="meta"><div class="token">--t-md</div><div class="spec">15–16px · 700</div></div><div style="font-size:clamp(.9375rem,.90rem+.19vw,1rem);font-weight:700;letter-spacing:-.015em;color:#0F1410;">Monto a cobrar</div></div>
</body></html>
