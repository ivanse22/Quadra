<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Light.otf') format('opentype');font-weight:300;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;font-style:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#F8F9F8;padding:20px;display:flex;flex-direction:column;gap:16px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#9DAD9F;margin-bottom:4px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Satoshi',sans-serif;font-weight:700;font-size:13px;letter-spacing:-.01em;white-space:nowrap;border:none;cursor:pointer;border-radius:9999px;transition:all 160ms cubic-bezier(.16,1,.3,1);}
.btn-primary{height:52px;padding:0 24px;background:#BDF300;color:#1A2400;}
.btn-secondary{height:52px;padding:0 24px;background:transparent;color:#0F1410;border:1.5px solid rgba(0,0,0,.18);}
.btn-ghost{height:44px;padding:0 16px;background:transparent;color:#6B7B6D;}
.btn-sm{height:36px;padding:0 16px;font-size:12px;}
.btn-loading{background:#ECEEED;color:#6B7B6D;cursor:wait;height:52px;padding:0 24px;}
.btn-success{background:#16A34A;color:#fff;height:52px;padding:0 24px;}
.btn-disabled{opacity:.38;cursor:not-allowed;height:52px;padding:0 24px;background:#BDF300;color:#1A2400;}
.spin{width:14px;height:14px;border:2px solid rgba(107,123,109,.3);border-top-color:#6B7B6D;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
</style></head><body>
<div>
<div class="label">Primary</div>
<div class="row">
  <button class="btn btn-primary">Enviar cobro</button>
  <button class="btn btn-primary btn-sm">Cobrar</button>
  <button class="btn btn-primary btn-disabled" disabled>Enviar cobro</button>
</div>
</div>
<div>
<div class="label">Secondary & Ghost</div>
<div class="row">
  <button class="btn btn-secondary">Cancelar</button>
  <button class="btn btn-ghost">Ver historial</button>
  <button class="btn btn-secondary btn-sm">Editar</button>
</div>
</div>
<div>
<div class="label">Confirm Sequence</div>
<div class="row">
  <button class="btn btn-primary">Confirmar envío</button>
  <button class="btn btn-loading"><span class="spin"></span> Procesando…</button>
  <button class="btn btn-success">✓ Enviado</button>
</div>
</div>
</body></html>
