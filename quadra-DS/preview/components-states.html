<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#F8F9F8;padding:20px;display:flex;gap:14px;flex-wrap:wrap;}

/* Empty state */
.empty{flex:1;min-width:200px;display:flex;flex-direction:column;align-items:center;padding:28px 20px;text-align:center;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:24px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.empty-visual{width:80px;height:80px;background:#F3F4F2;border:1.5px solid rgba(0,0,0,.07);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.empty-title{font-size:16px;font-weight:900;letter-spacing:-.03em;color:#0F1410;margin-bottom:6px;line-height:1.2;}
.empty-desc{font-size:12px;color:#6B7B6D;line-height:1.65;margin-bottom:18px;max-width:200px;}
.empty-cta{height:44px;padding:0 20px;border-radius:9999px;background:#BDF300;color:#1A2400;font-family:'Satoshi',sans-serif;font-size:13px;font-weight:700;border:none;cursor:pointer;}

/* Error state */
.errstate{flex:1;min-width:200px;display:flex;flex-direction:column;align-items:center;padding:28px 20px;text-align:center;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:24px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.err-icon{width:72px;height:72px;background:rgba(220,38,38,.07);border:1.5px solid rgba(220,38,38,.16);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.err-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.10em;color:#DC2626;margin-bottom:6px;}
.err-title{font-size:16px;font-weight:900;letter-spacing:-.03em;color:#0F1410;margin-bottom:6px;line-height:1.2;}
.err-desc{font-size:12px;color:#6B7B6D;line-height:1.65;margin-bottom:18px;max-width:200px;}
.err-retry{height:44px;padding:0 20px;border-radius:9999px;background:#0F1410;color:#F1F2EF;font-family:'Satoshi',sans-serif;font-size:13px;font-weight:700;border:none;cursor:pointer;margin-bottom:8px;}
.err-ghost{font-size:12px;font-weight:600;color:#9DAD9F;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Satoshi',sans-serif;}
</style></head><body>
<div class="empty">
  <div class="empty-visual"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9DAD9F" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="12" y1="8" x2="12" y2="16"/></svg></div>
  <div class="empty-title">Sin cobros aún</div>
  <div class="empty-desc">Crea tu primer cobro y empieza a recibir pagos</div>
  <button class="empty-cta">+ Crear cobro</button>
</div>
<div class="errstate">
  <div class="err-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
  <div class="err-type">Error de conexión</div>
  <div class="err-title">No se pudo cargar</div>
  <div class="err-desc">Revisa tu conexión a internet e intenta de nuevo</div>
  <button class="err-retry">Reintentar</button>
  <button class="err-ghost">Volver al inicio</button>
</div>
</body></html>
