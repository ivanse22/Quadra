<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#F8F9F8;padding:20px;display:flex;gap:14px;align-items:flex-start;}

.numpad{background:#F3F4F2;border-top:1px solid rgba(0,0,0,.07);padding:10px 12px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;}
.numpad-key{height:56px;border-radius:18px;background:#fff;border:1px solid rgba(0,0,0,.07);font-family:'Satoshi',sans-serif;font-size:22px;font-weight:700;color:#0F1410;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:1px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.numpad-key-sub{font-size:8px;font-weight:500;color:#9DAD9F;letter-spacing:.04em;}
.numpad-key.zero{grid-column:1/3;}
.numpad-key.del{background:#F3F4F2;box-shadow:none;border-color:rgba(0,0,0,.07);color:#6B7B6D;}
.numpad-key.action{background:#BDF300;border-color:transparent;color:#1A2400;box-shadow:0 4px 12px rgba(189,243,0,.20);}

.amount-display{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 12px;}
.amount-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#9DAD9F;margin-bottom:10px;}
.amount-val{font-size:52px;font-weight:900;letter-spacing:-.05em;line-height:1;color:#3D5200;font-variant-numeric:tabular-nums;}
.amount-dec{color:rgba(61,82,0,.25);}
.amount-divider{height:2px;background:#3D5200;border-radius:2px;margin-top:10px;}
.amount-currency{font-size:11px;color:#9DAD9F;margin-top:8px;}
</style></head><body>
<div class="amount-display">
  <div class="amount-label">Monto a cobrar</div>
  <div class="amount-val">$1,200<span class="amount-dec">.00</span></div>
  <div class="amount-divider"></div>
  <div class="amount-currency">MXN · Pesos mexicanos</div>
</div>
<div class="numpad">
  <div class="numpad-key">1<span class="numpad-key-sub"></span></div>
  <div class="numpad-key">2<span class="numpad-key-sub">ABC</span></div>
  <div class="numpad-key">3<span class="numpad-key-sub">DEF</span></div>
  <div class="numpad-key">4<span class="numpad-key-sub">GHI</span></div>
  <div class="numpad-key">5<span class="numpad-key-sub">JKL</span></div>
  <div class="numpad-key">6<span class="numpad-key-sub">MNO</span></div>
  <div class="numpad-key">7<span class="numpad-key-sub">PQRS</span></div>
  <div class="numpad-key">8<span class="numpad-key-sub">TUV</span></div>
  <div class="numpad-key">9<span class="numpad-key-sub">WXYZ</span></div>
  <div class="numpad-key zero">0</div>
  <div class="numpad-key del"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></div>
  <div class="numpad-key action" style="grid-column:1/-1;font-size:15px;font-weight:700;letter-spacing:-.01em;">Continuar →</div>
</div>
</body></html>
