<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Light.otf') format('opentype');font-weight:300;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;font-style:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#fff;padding:20px 24px;display:flex;flex-direction:column;gap:10px;}
.row{display:grid;grid-template-columns:130px 80px 1fr;gap:10px;align-items:center;}
.token{font-size:10px;font-weight:700;color:#3D5200;font-family:monospace;}
.val{font-size:10px;color:#6B7B6D;}
.bar-wrap{background:#F3F4F2;border-radius:4px;height:8px;overflow:hidden;}
.bar{height:100%;background:#BDF300;border-radius:4px;}
.ease{font-size:9px;color:#9DAD9F;}
</style></head><body>
<div class="row"><span class="token">--motion-instant</span><span class="val">80ms</span><div class="bar-wrap"><div class="bar" style="width:6%;"></div></div></div>
<div class="row"><span class="token">--motion-fast</span><span class="val">160ms</span><div class="bar-wrap"><div class="bar" style="width:12%;"></div></div></div>
<div class="row"><span class="token">--motion-base</span><span class="val">260ms</span><div class="bar-wrap"><div class="bar" style="width:20%;"></div></div></div>
<div class="row"><span class="token">--motion-slow</span><span class="val">400ms</span><div class="bar-wrap"><div class="bar" style="width:30%;"></div></div></div>
<div class="row"><span class="token">--motion-xslow</span><span class="val">580ms</span><div class="bar-wrap"><div class="bar" style="width:44%;"></div></div></div>
<div style="margin-top:6px;display:flex;flex-direction:column;gap:5px;">
<div class="row"><span class="token">--ease-out</span><span class="ease">cubic-bezier(.16,1,.3,1)</span><span style="font-size:9px;color:#9DAD9F;">default — snappy entry</span></div>
<div class="row"><span class="token">--ease-spring</span><span class="ease">cubic-bezier(.34,1.56,.64,1)</span><span style="font-size:9px;color:#9DAD9F;">overshoot — celebrate</span></div>
<div class="row"><span class="token">--ease-in-out</span><span class="ease">cubic-bezier(.4,0,.2,1)</span><span style="font-size:9px;color:#9DAD9F;">shared axis transitions</span></div>
</div>
</body></html>
