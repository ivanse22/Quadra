<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#F3F4F2;padding:24px 28px;display:flex;flex-direction:column;gap:8px;}

.toast{
  display:flex;align-items:center;gap:10px;
  padding:11px 16px 11px 12px;
  border-radius:14px;
  font-size:13px;font-weight:500;
  background:#fff;
  border:1px solid rgba(0,0,0,.08);
  box-shadow:0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  animation:in .22s cubic-bezier(.16,1,.3,1) both;
}
@keyframes in{from{transform:translateY(6px);opacity:0;}to{transform:none;opacity:1;}}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.text{flex:1;color:#0F1410;line-height:1.4;}
.action{font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;padding-left:12px;margin-left:2px;border-left:1px solid rgba(0,0,0,.08);min-width:64px;text-align:right;}
</style></head><body>
<div class="toast" style="animation-delay:0ms">
  <div class="dot" style="background:#16A34A;"></div>
  <div class="text">Cobro enviado correctamente</div>
  <div class="action" style="color:#16A34A;">Ver →</div>
</div>
<div class="toast" style="animation-delay:50ms">
  <div class="dot" style="background:#DC2626;"></div>
  <div class="text">No se pudo procesar el pago</div>
  <div class="action" style="color:#DC2626;">Reintentar →</div>
</div>
<div class="toast" style="animation-delay:100ms">
  <div class="dot" style="background:#B45309;"></div>
  <div class="text">Saldo insuficiente para la reserva</div>
</div>
<div class="toast" style="animation-delay:150ms">
  <div class="dot" style="background:#BDF300;box-shadow:0 0 0 2px rgba(189,243,0,.3);"></div>
  <div class="text">Tipo de cambio actualizado: $17.24</div>
</div>
</body></html>
