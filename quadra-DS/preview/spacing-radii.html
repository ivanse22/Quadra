<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Light.otf') format('opentype');font-weight:300;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;font-style:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Satoshi',sans-serif;background:#F8F9F8;padding:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;}
.swatch{background:#0F1410;display:flex;align-items:center;justify-content:center;}
.token{font-size:9px;font-weight:700;color:#3D5200;font-family:monospace;text-align:center;}
.val{font-size:9px;color:#6B7B6D;text-align:center;}
</style></head><body>
<div class="item"><div class="swatch" style="width:32px;height:32px;border-radius:4px;"></div><div class="token">--r-xs</div><div class="val">4px</div></div>
<div class="item"><div class="swatch" style="width:36px;height:36px;border-radius:6px;"></div><div class="token">--r-sm</div><div class="val">6px</div></div>
<div class="item"><div class="swatch" style="width:40px;height:40px;border-radius:10px;"></div><div class="token">--r-md</div><div class="val">10px</div></div>
<div class="item"><div class="swatch" style="width:44px;height:44px;border-radius:14px;"></div><div class="token">--r-lg</div><div class="val">14px</div></div>
<div class="item"><div class="swatch" style="width:48px;height:48px;border-radius:18px;"></div><div class="token">--r-xl</div><div class="val">18px</div></div>
<div class="item"><div class="swatch" style="width:52px;height:52px;border-radius:24px;"></div><div class="token">--r-2xl</div><div class="val">24px</div></div>
<div class="item"><div class="swatch" style="width:56px;height:56px;border-radius:32px;"></div><div class="token">--r-3xl</div><div class="val">32px</div></div>
<div class="item"><div class="swatch" style="width:60px;height:32px;border-radius:9999px;"></div><div class="token">--r-full</div><div class="val">pill</div></div>
</body></html>
