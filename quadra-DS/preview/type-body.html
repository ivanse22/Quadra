<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Light.otf') format('opentype');font-weight:300;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Medium.otf') format('opentype');font-weight:500;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;font-style:normal;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;font-style:normal;}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#fff;padding:24px 28px;}
.row{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06);}
.row:last-child{border-bottom:none;}
.token{font-size:10px;font-weight:700;color:#3D5200;font-family:monospace;}
.spec{font-size:10px;color:#6B7B6D;margin-top:2px;}
</style></head><body>
<div class="row"><div><div class="token">--t-base</div><div class="spec">13–14px · 400 · DM Sans</div></div><div style="font-size:clamp(.8125rem,.78rem+.16vw,.875rem);color:#3D4A3F;line-height:1.6;">Registra tus cobros y recibe pagos fácilmente. Controla tus ingresos y gastos.</div></div>
<div class="row"><div><div class="token">--t-sm</div><div class="spec">12–13px · 500 · DM Sans</div></div><div style="font-size:clamp(.75rem,.72rem+.15vw,.8125rem);font-weight:500;color:#6B7B6D;">Hace 2 días · Transferencia · Bancomer</div></div>
<div class="row"><div><div class="token">--t-xs</div><div class="spec">10–11px · 400 · DM Sans</div></div><div style="font-size:clamp(.625rem,.60rem+.13vw,.6875rem);color:#9DAD9F;letter-spacing:.01em;">INGRESO · GASTO · PENDIENTE</div></div>
<div class="row"><div><div class="token">code</div><div class="spec">10.5px · Courier New</div></div><div style="font-family:'Courier New',monospace;font-size:10.5px;background:#F3F4F2;padding:6px 10px;border-radius:6px;color:#3D5200;">--volt: #BDF300</div></div>
</body></html>
