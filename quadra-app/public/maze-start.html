<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Preparando Quadra</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #111111;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 360px);
        text-align: center;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 24px;
        border-radius: 14px;
        background: linear-gradient(135deg, #111111 0 48%, #bdf300 49% 100%);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.1;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: #5f665f;
        font-size: 15px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Preparando Quadra</h1>
      <p>Estamos limpiando la sesion de prueba para que veas la pantalla correcta.</p>
    </main>
    <script>
      (function () {
        var redirected = false;
        var allowedTasks = {
          ingreso: true,
          pila: true,
          renta: true
        };

        function getTask() {
          var match = window.location.search.match(/[?&]task=([^&]+)/);
          if (!match) return 'ingreso';
          try {
            return decodeURIComponent(match[1].replace(/\+/g, ' '));
          } catch (err) {
            return 'ingreso';
          }
        }

        function safe(fn) {
          try {
            return fn();
          } catch (err) {
            return null;
          }
        }

        function clearBrowserStorage() {
          safe(function () { window.localStorage.clear(); });
          safe(function () { window.sessionStorage.clear(); });
        }

        function unregisterServiceWorkers() {
          if (!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistrations) {
            return Promise.resolve();
          }
          return navigator.serviceWorker.getRegistrations()
            .then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister().catch(function () {});
              }));
            })
            .catch(function () {});
        }

        function clearCaches() {
          if (!('caches' in window) || !window.caches.keys) {
            return Promise.resolve();
          }
          return window.caches.keys()
            .then(function (keys) {
              return Promise.all(keys.map(function (key) {
                return window.caches.delete(key).catch(function () {});
              }));
            })
            .catch(function () {});
        }

        function redirectToTask() {
          if (redirected) return;
          redirected = true;
          var task = getTask();
          if (!allowedTasks[task]) task = 'ingreso';
          window.location.replace('/maze/' + task + '?fresh=' + Date.now());
        }

        clearBrowserStorage();
        Promise.all([unregisterServiceWorkers(), clearCaches()])
          .then(function () {
            clearBrowserStorage();
            window.setTimeout(redirectToTask, 120);
          })
          .catch(redirectToTask);

        window.setTimeout(redirectToTask, 2500);
      })();
    </script>
  </body>
</html>
