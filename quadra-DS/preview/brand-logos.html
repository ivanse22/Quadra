<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#E4E6E3;padding:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.block{border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);flex:1;min-width:120px;max-width:180px;}
.block img,.block svg{width:100%;display:block;}
.info{padding:8px 10px;background:#fff;}
.name{font-family:monospace;font-size:10px;color:#3D4A3F;font-weight:700;}
.sub{font-size:9px;color:#9DAD9F;margin-top:1px;}
</style></head><body>
<div class="block">
  <img src="../assets/logo-wide-dark.svg" alt="Logo wide dark">
  <div class="info"><div class="name">logo-wide-dark</div><div class="sub">Dark green bg #062517</div></div>
</div>
<div class="block">
  <img src="../assets/logo-wide-light.svg" alt="Logo wide light">
  <div class="info"><div class="name">logo-wide-light</div><div class="sub">Off-white bg #F1F2EF</div></div>
</div>
<div class="block">
  <img src="../assets/logo-wide-navy.svg" alt="Logo wide navy">
  <div class="info"><div class="name">logo-wide-navy</div><div class="sub">Navy dark bg #0B1118</div></div>
</div>
<div class="block" style="max-width:100px;">
  <img src="../assets/logo-icon-dark.svg" alt="Icon dark">
  <div class="info"><div class="name">icon-dark</div><div class="sub">Dark green</div></div>
</div>
<div class="block" style="max-width:100px;">
  <img src="../assets/logo-icon-light.svg" alt="Icon light">
  <div class="info"><div class="name">icon-light</div><div class="sub">Off-white</div></div>
</div>
<div class="block" style="max-width:100px;">
  <img src="../assets/logo-icon-navy.svg" alt="Icon navy">
  <div class="info"><div class="name">icon-navy</div><div class="sub">Navy</div></div>
</div>
</body></html>
