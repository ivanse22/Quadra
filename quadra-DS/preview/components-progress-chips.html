<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Bold.otf') format('opentype');font-weight:700;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Black.otf') format('opentype');font-weight:900;}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Regular.otf') format('opentype');font-weight:400;}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#F8F9F8;padding:20px;display:flex;flex-direction:column;gap:16px;}
.eyebrow{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#9DAD9F;margin-bottom:8px;}

/* ── Progress bars ── */
.prog-wrap{display:flex;flex-direction:column;gap:10px;}
.prog-row{display:flex;align-items:center;gap:12px;}
.prog-label{font-family:'DM Sans',sans-serif;font-size:11px;color:#6B7B6D;min-width:80px;}
.prog-track{flex:1;height:6px;background:#ECEEED;border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(.16,1,.3,1);}
.prog-val{font-family:'Satoshi',sans-serif;font-size:11px;font-weight:700;color:#0F1410;min-width:32px;text-align:right;}

/* Step progress */
.step-row{display:flex;gap:0;align-items:center;}
.step-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Satoshi',sans-serif;font-size:10px;font-weight:700;flex-shrink:0;border:2px solid;}
.step-line{flex:1;height:2px;}

/* ── Filter chips ── */
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:9999px;font-family:'Satoshi',sans-serif;font-size:12px;font-weight:700;border:1.5px solid;cursor:pointer;transition:all .14s;}
.chip-dot{width:6px;height:6px;border-radius:50%;}
</style></head><body>

<div>
  <div class="eyebrow">Barras de progreso</div>
  <div style="background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:18px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.04);">
    <div class="prog-wrap">
      <div class="prog-row"><span class="prog-label">Cobrado</span><div class="prog-track"><div class="prog-fill" style="width:72%;background:#3D5200;"></div></div><span class="prog-val">72%</span></div>
      <div class="prog-row"><span class="prog-label">Pendiente</span><div class="prog-track"><div class="prog-fill" style="width:48%;background:#B45309;"></div></div><span class="prog-val">48%</span></div>
      <div class="prog-row"><span class="prog-label">Meta mes</span><div class="prog-track"><div class="prog-fill" style="width:89%;background:#BDF300;"></div></div><span class="prog-val">89%</span></div>
      <div class="prog-row"><span class="prog-label">Vencido</span><div class="prog-track"><div class="prog-fill" style="width:15%;background:#DC2626;"></div></div><span class="prog-val">15%</span></div>
    </div>
  </div>
</div>

<div>
  <div class="eyebrow">Progreso de pasos (onboarding)</div>
  <div style="background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:18px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:14px;">
    <!-- Linear progress -->
    <div style="height:3px;background:#ECEEED;border-radius:2px;overflow:hidden;"><div style="height:100%;width:66%;background:#3D5200;border-radius:2px;"></div></div>
    <!-- Step dots -->
    <div class="step-row">
      <div class="step-dot" style="background:#3D5200;border-color:#3D5200;color:#BDF300;">✓</div>
      <div class="step-line" style="background:#3D5200;"></div>
      <div class="step-dot" style="background:#3D5200;border-color:#3D5200;color:#BDF300;">✓</div>
      <div class="step-line" style="background:#ECEEED;"></div>
      <div class="step-dot" style="background:#fff;border-color:#3D5200;color:#3D5200;">3</div>
      <div class="step-line" style="background:#ECEEED;"></div>
      <div class="step-dot" style="background:#fff;border-color:#ECEEED;color:#9DAD9F;">4</div>
    </div>
  </div>
</div>

<div>
  <div class="eyebrow">Chips de filtro</div>
  <div style="display:flex;flex-direction:column;gap:8px;">
    <!-- All selected -->
    <div class="chips">
      <div class="chip" style="background:#0F1410;border-color:#0F1410;color:#F1F2EF;">Todo</div>
      <div class="chip" style="background:rgba(22,163,74,.08);border-color:rgba(22,163,74,.20);color:#16A34A;"><div class="chip-dot" style="background:#16A34A;"></div>Ingresos</div>
      <div class="chip" style="background:rgba(220,38,38,.06);border-color:rgba(220,38,38,.16);color:#DC2626;"><div class="chip-dot" style="background:#DC2626;"></div>Gastos</div>
      <div class="chip" style="background:rgba(180,83,9,.07);border-color:rgba(180,83,9,.18);color:#B45309;"><div class="chip-dot" style="background:#B45309;"></div>Pendiente</div>
    </div>
    <!-- Inactive state -->
    <div class="chips">
      <div class="chip" style="background:#F3F4F2;border-color:rgba(0,0,0,.10);color:#9DAD9F;">Todo</div>
      <div class="chip" style="background:#F3F4F2;border-color:rgba(0,0,0,.10);color:#9DAD9F;"><div class="chip-dot" style="background:#9DAD9F;"></div>Ingresos</div>
      <div class="chip" style="background:#0F1410;border-color:#0F1410;color:#F1F2EF;"><div class="chip-dot" style="background:#BDF300;"></div>Gastos</div>
      <div class="chip" style="background:#F3F4F2;border-color:rgba(0,0,0,.10);color:#9DAD9F;"><div class="chip-dot" style="background:#9DAD9F;"></div>Pendiente</div>
    </div>
  </div>
</div>

</body></html>
